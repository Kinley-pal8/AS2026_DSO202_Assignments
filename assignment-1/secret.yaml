# Task 2 -- all credential values, and nothing else.
#
# SECURITY CAVEAT (documentation requirement, not a bug to fix here):
# Kubernetes Secrets are only base64-ENCODED, not encrypted at rest by
# default -- anyone who can read this object, or etcd, recovers the values
# with `base64 -d`. Encryption-at-rest (EncryptionConfiguration) and tighter
# RBAC are the real mitigations and are out of scope for Unit I.
#
# The values below are base64 of local-dev placeholders:
#   taskuser -> dGFza3VzZXI=
#   taskpass -> dGFza3Bhc3M=
apiVersion: v1
kind: Secret
metadata:
  name: task-tracker-secret
  namespace: dso202-assignment-01
  labels:
    app: task-tracker
type: Opaque
data:
  # ---- consumed by the backend ----
  DB_USER: dGFza3VzZXI=
  DB_PASSWORD: dGFza3Bhc3M=
  # ---- consumed by the postgres container (must match the pair above) ----
  POSTGRES_USER: dGFza3VzZXI=
  POSTGRES_PASSWORD: dGFza3Bhc3M=
