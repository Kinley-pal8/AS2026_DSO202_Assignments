# Task 3 -- database tier: single-replica Deployment backed by the PVC.
# Consumes ONLY the POSTGRES_* keys (never DB_*), per the brief.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: dso202-assignment-01
  labels:
    app: task-tracker
    tier: database
spec:
  replicas: 1
  strategy:
    type: Recreate          # never run two postgres Pods against one RWO volume
  selector:
    matchLabels:
      app: task-tracker
      tier: database
  template:
    metadata:
      labels:
        app: task-tracker
        tier: database
    spec:
      containers:
        - name: postgres
          image: sarojsanyasi/dso202-db:1.0
          # The tutor's registry image is arm64-only; on an amd64 host the
          # identical image is built from ./images/db and preloaded with
          # `kind load docker-image` (see README "Image note").
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # database name from the ConfigMap ...
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: task-tracker-config
                  key: POSTGRES_DB
            # ... credentials from the Secret
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: POSTGRES_PASSWORD
            # Keep PGDATA in a sub-directory of the mount point so the
            # official image initialises cleanly on a fresh volume.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: db-data
