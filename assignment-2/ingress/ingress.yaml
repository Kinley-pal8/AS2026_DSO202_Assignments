# Unit II 2.2 -- Ingress resource.
#
# Two hosts on ONE Ingress / one controller IP demonstrate name-based
# virtual hosting (2.2.1.3):
#   * tasktracker.dso202.local -- the public app: "/" -> frontend,
#     "/api" -> backend (same origin, see configmap.yaml's BACKEND_URL note
#     -- this is what actually fixes Assignment 1's browser limitation).
#   * status.dso202.local      -- a separate "internal" virtual host that
#     goes straight to the backend Service, illustrating that a hostname is
#     just a routing key: same IP, same port, a different Service entirely.
#
# TLS termination (2.2.1.2) is configured below against a self-signed
# Secret; the Secret's key material is generated by scripts/deploy.sh at
# deploy time (kubectl create secret tls), never committed to the repo.
#
# Annotations (2.2.3, controller-specific -- these are ingress-nginx
# annotations and would differ on Traefik):
#   ssl-redirect: "false"   -- classroom convenience so plain http:// still
#                              works without a browser HSTS/redirect loop
#                              against a self-signed cert.
#   proxy-body-size: "5m"   -- raises nginx's default 1m request body cap,
#                              a common real-world tuning knob for this
#                              controller specifically.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-tracker
  namespace: dso202-assignment-02
  labels:
    app: task-tracker
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "5m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tasktracker.dso202.local
        - status.dso202.local
      secretName: tasktracker-tls
  rules:
    - host: tasktracker.dso202.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
    - host: status.dso202.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
