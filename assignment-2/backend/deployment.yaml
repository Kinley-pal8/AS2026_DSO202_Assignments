# Same backend tier as Assignment 1, plus one Unit II addition:
# `serviceAccountName: backend-sa` (2.3.3.2 -- using a ServiceAccount for
# Pod authentication). backend-sa (rbac/rbac.yaml) has NO Role/RoleBinding
# targeting it, so this Pod authenticates to the API server as backend-sa
# (it has an identity, via its mounted projected token) but is authorized
# for nothing -- see README "RBAC" for the exec'd proof, contrasted with the
# `viewer` ServiceAccount which IS bound to a Role.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dso202-assignment-02
  labels:
    app: task-tracker
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-tracker
      tier: backend
  template:
    metadata:
      labels:
        app: task-tracker
        tier: backend
    spec:
      serviceAccountName: backend-sa
      containers:
        - name: backend
          image: sarojsanyasi/dso202-backend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: task-tracker-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: task-tracker-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: task-tracker-config
                  key: DB_NAME
            - name: APP_PORT
              valueFrom:
                configMapKeyRef:
                  name: task-tracker-config
                  key: APP_PORT
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: task-tracker-config
                  key: CORS_ORIGIN
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
